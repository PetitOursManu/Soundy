# Vérifie que l'application Android (APK) se compile, à chaque push sur une
# branche autre que main.
#
# - APK de test téléchargeable dans l'onglet « Actions » → « Artifacts ».
# - Ce workflow tourne sur du code qui n'est pas encore relu (branches de travail,
#   propositions de correction) : il reste en LECTURE SEULE et ne reçoit AUCUN
#   secret. L'APK est signé avec une clé de test jetable : il ne s'installe pas
#   par-dessus l'application officielle (il faut d'abord la désinstaller).
# - L'APK signé avec la vraie clé et la Release sont faits par release.yml, sur
#   main seulement.
name: Android APK (vérification)

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Compilation de l'application web
        run: npm run build
        env:
          # À définir dans Settings → Secrets and variables → Actions → Variables
          VITE_EMBY_URL: ${{ vars.SOUNDY_EMBY_URL }}
          VITE_REQUESTS_URL: ${{ vars.SOUNDY_REQUESTS_URL }}

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilation de l'APK (clé de test)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../soundy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: soundy-apk
          path: soundy.apk
          if-no-files-found: error
