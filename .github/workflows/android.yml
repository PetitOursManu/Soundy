# Compile automatiquement l'application Android (APK) à chaque push.
# - Push classique : APK téléchargeable dans l'onglet « Actions » → « Artifacts ».
# - Étiquette de version (ex. v1.0.0) : une Release GitHub est créée avec l'APK.
name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier en Release (ex. v1.0.0) — laisser vide pour une simple compilation"
        required: false
        default: ""

permissions:
  contents: write # nécessaire pour publier la Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Compilation de l'application web
        run: npm run build
        env:
          # À définir dans Settings → Secrets and variables → Actions → Variables
          VITE_EMBY_URL: ${{ vars.SOUNDY_EMBY_URL }}
          VITE_REQUESTS_URL: ${{ vars.SOUNDY_REQUESTS_URL }}

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: soundy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Version publiée
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Soundy-$V.apk"

      - name: Publication de la Release GitHub
        if: steps.rel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Soundy ${{ steps.rel.outputs.version }}
          make_latest: true
          files: Soundy-${{ steps.rel.outputs.version }}.apk
          body: |
            ## 📱 Installer Soundy sur Android
            1. Téléchargez **Soundy-${{ steps.rel.outputs.version }}.apk** ci-dessous depuis votre téléphone.
            2. Ouvrez le fichier et autorisez l'installation depuis cette source si Android le demande.
            3. Connectez-vous avec votre compte Emby, puis indiquez l'adresse de votre serveur Soundy
               dans *Réglages → Serveur de demandes* (pour l'onglet Demandes).

            > APK signé avec une clé de développement : pour une mise à jour, il peut être nécessaire
            > de désinstaller la version précédente.
